name: Publish histology review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack website files
        run: |
          mkdir -p public
          for part in 1 2 3 4; do
            unzip -q "site-part-${part}.zip" -d public
          done
          cp app.js styles.css index.html public/
          test -s public/index.html
          test -s public/course.js
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
