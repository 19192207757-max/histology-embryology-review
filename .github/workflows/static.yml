name: Publish histology review
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble review website
        run: |
          mkdir -p public
          for part in 1 2 3 4; do
            unzip -q "site-part-${part}.zip" -d public
          done
          unzip -oq ppt-interface.zip -d public
          unzip -q study-figures.zip -d public
          cp study-supplement.js public/
          test -s public/index.html
          test -s public/course.js
          test -s public/study-supplement.js
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
